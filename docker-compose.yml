services:

  backend:

    build:
      context: .

      dockerfile: Dockerfile


    container_name: agent-backend


    ports:

      - "8000:8000"


    env_file:

      - .env


    volumes:

      - ./data:/app/data


    restart: unless-stopped



  frontend:


    build:

      context: ./frontend


      dockerfile: Dockerfile


    container_name: agent-frontend


    ports:

      - "5173:80"


    depends_on:

      - backend


    restart: unless-stopped